name: Build

# Builds the mod and runs the tests on every commit, so a broken build is caught early
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: twitchspawn-${{ github.sha }}
          path: |
            build/libs/*.jar
            !build/libs/*-slim.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
